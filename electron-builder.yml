appId: com.athanasioust.sanctum
productName: Sanctum
copyright: Copyright © athanasioust — AGPL-3.0

directories:
  output: dist
  buildResources: electron

# The Electron shell (main process) is the only code inside the asar. The actual
# app — the standalone Next.js server plus its native better-sqlite3 binary and
# the migrations — ships as unpacked resources so the .node file can be loaded
# and the server can be spawned as a child process.
files:
  - electron/**/*
  - package.json
  # The main process only needs Electron + Node builtins; the app itself runs
  # from the standalone bundle in extraResources. Keep node_modules out of the
  # asar so it doesn't redundantly bundle @next/better-sqlite3/sharp (~180 MB).
  - "!node_modules/**"

# The standalone bundle is copied in as unpacked resources. electron-builder
# strips node_modules from extraResources, so the server's dependencies (incl.
# the native better-sqlite3 binary) are restored by the afterPack hook below.
extraResources:
  - from: .next/standalone
    to: standalone

afterPack: electron/after-pack.js

# We fetch a prebuilt better-sqlite3 for Electron ourselves (see
# scripts/build-desktop.mjs); electron-builder must not try to rebuild the root
# node_modules, which we do not ship inside the asar.
npmRebuild: false

win:
  icon: electron/icon.ico
  target:
    - target: nsis
      arch:
        - x64
    - target: portable
      arch:
        - x64

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Sanctum

portable:
  artifactName: Sanctum-${version}-portable.exe
  # Extract to a predictable %TEMP%\Sanctum instead of a per-build random id.
  # Note this does NOT make later launches faster: electron-builder's portable
  # stub deletes and re-extracts the ~118 MB payload on every launch, and wipes
  # it again on exit (see portable.nsi in app-builder-lib), so there is nothing
  # to reuse. Measured cold vs. warm launches are within noise of each other.
  # The installer is the fast way to run Sanctum; the portable exe pays ~40s of
  # extraction every time.
  unpackDirName: Sanctum

# Linux artifacts must be built ON Linux (WSL is fine) — see the note in
# scripts/build-desktop.mjs. AppImage is the primary download: it is self
# contained and bundles its own sandbox handling. The tar.gz is a fallback for
# people who prefer to unpack it themselves; on some distros an unpacked build
# needs `--no-sandbox` (or a root-owned setuid chrome-sandbox) to launch.
# macOS artifacts must be built ON macOS (see scripts/build-desktop.mjs): the
# native better-sqlite3 binary and the .app bundle are both platform-specific.
# The build carries no Apple Developer identity, so Gatekeeper will refuse the
# first launch until the user right-clicks the app and chooses Open — same story
# as the Windows SmartScreen prompt. Real signing and notarization can be added
# later by supplying an identity; only the `identity` line below changes.
#
# The arch list here must stay in sync with `archs` in scripts/build-desktop.mjs,
# which stages one native better-sqlite3 binary per architecture.
mac:
  icon: electron/icon.icns
  category: public.app-category.games
  # Sanctum spawns its own local server and reads/writes only its own data
  # directory; the hardened runtime is off since there is nothing to entitle
  # and the build is not notarized.
  hardenedRuntime: false
  # Ad-hoc signing. Packaging rewrites the bundle (see electron/after-pack.js),
  # which invalidates the signature Electron ships with — and macOS on Apple
  # Silicon refuses to launch a binary with a broken signature outright ("Sanctum
  # is damaged"), which right-click → Open does NOT get past. electron-builder
  # only ad-hoc signs when the identity is explicitly "-"; leaving this unset
  # makes it skip signing altogether. Signing runs after afterPack, so the files
  # that hook copies in are covered.
  identity: "-"
  extendInfo:
    # Turning on local-network sharing makes the bundled server listen on every
    # interface so players can open the read-only view on their phones. macOS 15
    # gates local network access behind a privacy prompt, and without a purpose
    # string that prompt has no explanation for the user. Sharing is off by
    # default, so this is only reached if the DM enables it in Settings.
    NSLocalNetworkUsageDescription: >-
      Sanctum uses your local network only when you turn on sharing in Settings,
      so players on the same Wi-Fi can open the read-only player view.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

dmg:
  artifactName: Sanctum-${version}-${arch}.dmg

linux:
  icon: electron/icon.png
  # Sanctum ships on itch.io alongside games and players look for it in the
  # Games menu; switch to Utility if you would rather it filed as a tool.
  category: Game
  synopsis: Local-first D&D 5e campaign manager
  description: >-
    A local-first Dungeon Master's campaign manager for D&D 5e. Characters,
    NPCs, combat, maps, quests and notes live in a single SQLite database on
    your machine. No account, no cloud.
  executableName: sanctum
  # Without this the desktop environment cannot associate the running window
  # with the .desktop entry, so the taskbar shows a generic icon instead of
  # Sanctum's. It syncs Electron's WM_CLASS to the `desktopName` declared in
  # package.json (which is where electron-builder reads that name from).
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
    - target: tar.gz
      arch:
        - x64
